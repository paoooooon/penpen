[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "penpen"
version = "0.1.0"
description = "APIクライアントツール"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24.0",
]

[project.scripts]
penpen = "penpen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]