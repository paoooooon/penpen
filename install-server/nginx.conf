server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;

    # Install script
    location = /install.sh {
        add_header Content-Type application/x-sh;
    }

    # Download files
    location /files/ {
        add_header Content-Type application/octet-stream;
    }

    # Health check
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}